org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+UseParallelGC
org.gradle.java.installations.paths=C:\\Program Files\\Android\\Android Studio\\jbr
org.gradle.java.installations.auto-detect=true
org.gradle.java.installations.auto-download=false
android.useAndroidX=true

# ── Speed optimisations ───────────────────────────────────────────
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true

# Kotlin incremental & parallel
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true
kotlin.caching.enabled=true
kotlin.parallel.tasks.in.project=true

# Android
android.enableR8.fullMode=false
android.defaults.buildfeatures.buildconfig=true
android.nonTransitiveRClass=true

# Skip unnecessary tasks during dev
android.enableJetifier=false
android.suppressUnsupportedOptionWarnings=android.enableJetifier
