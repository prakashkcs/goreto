<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | Goreto</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --pink: #F2028A; --pink2: #D946EF; --dark: #05030A; --card: #110E1B; --text: #F0ECF8; --muted: #9B8FB0; }
    html, body { height: 100%; }
    body {
      background: var(--dark); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex; align-items: center; justify-content: center;
      text-align: center; padding: 24px;
    }
    .wrap { max-width: 480px; }
    .code {
      font-size: clamp(72px, 16vw, 120px); font-weight: 900; line-height: 1;
      background: linear-gradient(135deg,#F2028A,#D946EF,#A855F7);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    h1 { font-size: 22px; font-weight: 800; margin-bottom: 12px; }
    p { color: var(--muted); font-size: 15px; margin-bottom: 32px; line-height: 1.6; }
    .btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .btn-primary {
      display: inline-flex; align-items: center; gap: 8px;
      background: linear-gradient(135deg,#F2028A,#D946EF); color: #fff;
      border-radius: 50px; padding: 13px 26px; font-size: 14px; font-weight: 700;
      text-decoration: none; box-shadow: 0 4px 24px rgba(242,2,138,0.4);
      transition: transform .2s, box-shadow .2s;
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(242,2,138,0.6); }
    .btn-ghost {
      display: inline-flex; align-items: center; gap: 8px;
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14);
      color: var(--text); border-radius: 50px; padding: 13px 26px;
      font-size: 14px; font-weight: 600; text-decoration: none;
      transition: background .2s, border-color .2s;
    }
    .btn-ghost:hover { background: rgba(255,255,255,0.1); border-color: rgba(242,2,138,0.4); }
    .logo { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 40px; }
    .logo img { width: 32px; height: 32px; object-fit: contain; }
    .logo span { font-size: 18px; font-weight: 900; background: linear-gradient(135deg,#F2028A,#D946EF); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo"><img src="/icon-192.png" alt="Goreto"><span>Goreto</span></div>
    <div class="code">404</div>
    <h1>This page took a wrong turn 💔</h1>
    <p>The page you're looking for doesn't exist or may have moved. Let's get you back on track.</p>
    <div class="btns">
      <a class="btn-primary" href="/">Go Home</a>
      <a class="btn-ghost" href="mailto:help@goreto.org">Contact Us</a>
    </div>
  </div>
</body>
</html>
