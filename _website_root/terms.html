<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Terms &amp; Conditions | Goreto</title>
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://goreto.org/terms.html">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --pink: #F2028A; --pink2: #D946EF; --dark: #05030A; --card: #110E1B; --text: #F0ECF8; --muted: #9B8FB0; }
    body { background: var(--dark); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; line-height: 1.7; }
    nav { display: flex; align-items: center; justify-content: space-between; padding: 16px 32px; background: rgba(5,3,10,0.9); border-bottom: 1px solid rgba(242,2,138,0.12); position: sticky; top: 0; }
    .nav-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
    .nav-logo img { width: 36px; height: 36px; object-fit: contain; }
    .nav-logo span { font-size: 20px; font-weight: 900; background: linear-gradient(135deg,#F2028A,#D946EF); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .back { font-size: 14px; color: var(--muted); text-decoration: none; }
    .back:hover { color: var(--pink); }
    main { max-width: 780px; margin: 0 auto; padding: 48px 24px 90px; }
    #doc { background: var(--card); border: 1px solid rgba(255,255,255,0.06); border-radius: 20px; padding: 40px; }
    #doc h2 { font-size: 28px; font-weight: 900; margin-bottom: 8px; }
    #doc h3 { font-size: 18px; font-weight: 700; margin: 28px 0 10px; color: var(--pink2); }
    #doc h4 { font-size: 15px; font-weight: 700; margin: 18px 0 8px; }
    #doc p { color: var(--text); margin-bottom: 12px; }
    #doc p:first-of-type { color: var(--muted); font-size: 14px; }
    #doc ul { margin: 0 0 12px 22px; }
    #doc li { margin-bottom: 6px; }
    #doc strong { color: #fff; }
    #status { color: var(--muted); text-align: center; padding: 60px 0; }
  </style>
</head>
<body>
  <nav>
    <a class="nav-logo" href="/"><img src="/icon-192.png" alt="Goreto"><span>Goreto</span></a>
    <a class="back" href="/">&larr; Back to home</a>
  </nav>
  <main>
    <div id="doc"><p id="status">Loading Terms &amp; Conditions&hellip;</p></div>
  </main>
  <script>
    fetch('https://goreto.org/ekloadmin/api/v1/api_legal.php?action=terms')
      .then(r => r.json())
      .then(data => {
        if (data.status === 'success' && data.page) {
          document.getElementById('doc').innerHTML = data.page.content;
          document.title = data.page.title + ' | Goreto';
        } else {
          document.getElementById('status').textContent = 'Unable to load the Terms & Conditions right now. Please try again later or contact help@goreto.org.';
        }
      })
      .catch(() => {
        document.getElementById('status').textContent = 'Unable to load the Terms & Conditions right now. Please try again later or contact help@goreto.org.';
      });
  </script>
</body>
</html>
