# Codemagic CI for Goreto.
#
# The iOS workflow exists because iOS cannot be built from the Windows machine
# this project is developed on. It produces a signed .ipa and, on the release
# workflow, uploads it to TestFlight.
#
# Signing authenticates through environment variables, not through the
# "Teams -> Team integrations -> Developer Portal" key store. That page only
# exists on team accounts, and `integrations: app_store_connect: <name>` can
# only refer to a key saved there, so on a personal account that route is a
# dead end. The variable route is documented by Codemagic and works on any
# plan: https://docs.codemagic.io/yaml-code-signing/signing-ios/
#
# Before the first iOS release run, create these in the Codemagic UI under
# Environment variables, all in group `goreto_ios`. They are credentials, so
# they are deliberately not in this file:
#
#   APP_STORE_CONNECT_PRIVATE_KEY     Secret. The whole .p8 file downloaded from
#                                     App Store Connect -> Users and Access ->
#                                     Integrations -> App Store Connect API,
#                                     including the BEGIN/END lines.
#   APP_STORE_CONNECT_KEY_IDENTIFIER  Secret. The Key ID of that key.
#   APP_STORE_CONNECT_ISSUER_ID       Secret. The Issuer ID shown above the
#                                     key list (one per account).
#   CERTIFICATE_PRIVATE_KEY           Secret. An RSA private key, BEGIN/END
#                                     lines included. Apple issues the iOS
#                                     distribution certificate against this,
#                                     so the same key must be reused for every
#                                     build, or Apple mints a new certificate
#                                     each time and an account may hold only
#                                     two. Generate one with:
#                                       ssh-keygen -t rsa -b 2048 -m PEM \
#                                         -f ios_distribution_private_key -q -N ""
#   APP_STORE_APPLE_ID                Not secret. 6835568733, the numeric id of
#                                     "Goreto Nepali Dating App" and the number
#                                     in appstoreconnect.apple.com/apps/<id>/
#   GOOGLE_SERVICES_IOS               Secret. base64 of
#                                     ios/Runner/GoogleService-Info.plist, which
#                                     is not committed. Firebase will not
#                                     initialise on iOS without it, so push and
#                                     Google Sign-In stay dead until it is set.
#                                       base64 -i GoogleService-Info.plist
#
# Group `goreto_android` (android workflow only): CM_KEYSTORE,
# CM_KEYSTORE_PASSWORD, CM_KEY_ALIAS, CM_KEY_PASSWORD, the same
# upload-keystore.jks already used locally.

definitions:
  flutter_version: &flutter_version 3.41.6

  base_cache: &base_cache
    cache_paths:
      - $HOME/.pub-cache
      - $FLUTTER_ROOT/.pub-cache

workflows:
  ios-release:
    name: iOS - build and ship to TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 90
    environment:
      flutter: *flutter_version
      xcode: latest
      cocoapods: default
      groups:
        - goreto_ios
      vars:
        BUNDLE_ID: "com.nex.ekloapp"
    cache:
      <<: *base_cache
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/Library/Caches/CocoaPods
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "v*"
          include: true
    scripts:
      - name: Check the signing credentials are present
        script: |
          # Failing here costs seconds. Failing after the build costs most of
          # the slot, and the error Apple returns for a missing key does not
          # obviously say that a key is missing.
          set -eu
          missing=""
          for v in APP_STORE_CONNECT_PRIVATE_KEY APP_STORE_CONNECT_KEY_IDENTIFIER \
                   APP_STORE_CONNECT_ISSUER_ID CERTIFICATE_PRIVATE_KEY \
                   APP_STORE_APPLE_ID GOOGLE_SERVICES_IOS; do
            eval "val=\${$v:-}"
            if [ -z "$val" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            echo "Missing from the goreto_ios variable group:$missing"
            echo "See the comment at the top of codemagic.yaml for each one."
            exit 1
          fi
          echo "All six signing variables are set."

      - name: Restore GoogleService-Info.plist
        script: |
          set -eu
          echo "$GOOGLE_SERVICES_IOS" | base64 --decode > ios/Runner/GoogleService-Info.plist
          plutil -lint ios/Runner/GoogleService-Info.plist

      - name: Flutter dependencies
        script: flutter pub get

      - name: Install pods
        script: |
          # Only this app's Podfile - see the note in ios-check below.
          cd ios
          pod install

      - name: Initialise the keychain
        script: keychain initialize

      - name: Fetch signing files
        script: |
          # --create lets Apple issue the certificate and the profile on the
          # first run. It matches an existing certificate against
          # CERTIFICATE_PRIVATE_KEY when one exists, so later runs reuse it
          # rather than burning one of the two distribution certificates an
          # account is allowed to hold.
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

      - name: Set up the signing certificate
        script: keychain add-certificates

      - name: Apply signing settings to the Xcode project
        script: xcode-project use-profiles

      - name: Set build number from App Store Connect
        script: |
          # Keeps CFBundleVersion monotonic without editing pubspec each time.
          # Apple rejects a build whose number is not higher than the last one.
          set -eu
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          BUILD_NUMBER=$((LATEST + 1))
          echo "Latest on TestFlight: $LATEST - building $BUILD_NUMBER"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $CM_ENV

      - name: Build IPA
        script: |
          set -euo pipefail
          flutter build ipa --release \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      app_store_connect:
        # The same three variables the CLI steps above authenticate with.
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        # Left off deliberately: review submission should be a human decision.
        submit_to_app_store: false

  # Note: this builds for a real device (-sdk iphoneos), not a simulator.
  # google_mlkit_face_detection pulls in MLKit pods that ship no arm64
  # simulator slice, so a simulator build fails on Apple Silicon runners.
  # Device builds are unaffected, and that is what ships.
  ios-check:
    name: iOS - analyse and build unsigned (every push)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: *flutter_version
      xcode: latest
      cocoapods: default
      groups:
        - goreto_ios
    cache: *base_cache
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: "*"
          include: true
    scripts:
      - name: Restore GoogleService-Info.plist
        script: |
          if [ -n "$GOOGLE_SERVICES_IOS" ]; then
            echo "$GOOGLE_SERVICES_IOS" | base64 --decode > ios/Runner/GoogleService-Info.plist
          else
            echo "No GOOGLE_SERVICES_IOS set - compiling without Firebase config."
          fi
      - name: Flutter dependencies
        script: flutter pub get
      - name: Analyse
        script: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Install pods
        script: |
          # Only this app's Podfile. A bare `find .` also walks
          # temp_flutter_project/, a scratch project committed years ago that
          # has nothing to do with the build.
          cd ios

          # No --repo-update: it makes CocoaPods re-read every version of every
          # podspec from the CDN, and with no Podfile.lock to narrow things down
          # that meant ~69 Firebase podspec fetches, all of which timed out.
          # The build image already ships a current spec repo.
          #
          # CDN timeouts are transient, so retry rather than failing the build
          # on one bad minute.
          for attempt in 1 2 3; do
            if pod install; then
              echo "pod install succeeded on attempt $attempt"
              exit 0
            fi
            echo "pod install failed (attempt $attempt of 3); waiting before retry"
            sleep $((attempt * 20))
          done

          echo "pod install still failing after 3 attempts."
          echo "If the errors are CDN timeouts the CocoaPods CDN is degraded;"
          echo "re-running the build later usually clears it."
          exit 1
      - name: Build unsigned
        script: |
          # `flutter build ios --no-codesign` compiles fine - the Xcode build
          # completes - but Flutter's wrapper then still demands a Development
          # Team and fails, which tells us nothing about whether the code is
          # sound. This workflow only needs to answer "does it compile", so
          # drive xcodebuild directly with signing switched off.
          set -euo pipefail
          flutter build ios --release --no-codesign --config-only
          cd ios
          xcodebuild \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build
    artifacts:
      - /tmp/xcodebuild_logs/*.log
      # Once a run resolves pods successfully, download this and commit it.
      # With a Podfile.lock in the repo CocoaPods stops exploring every
      # version of every pod, which is what made the CDN time out.
      - ios/Podfile.lock

  android-release:
    name: Android - signed release APK and AAB
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      flutter: *flutter_version
      java: 17
      groups:
        - goreto_android
    cache: *base_cache
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "v*"
          include: true
    scripts:
      - name: Restore the upload keystore
        script: |
          if [ -z "$CM_KEYSTORE" ]; then
            echo "CM_KEYSTORE is not set - an unsigned build cannot be shipped."
            exit 1
          fi
          echo "$CM_KEYSTORE" | base64 --decode > "$CM_BUILD_DIR/android/upload-keystore.jks"
          cat > "$CM_BUILD_DIR/android/key.properties" <<EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=../upload-keystore.jks
          EOF
      - name: Flutter dependencies
        script: flutter pub get
      - name: Build AAB
        script: flutter build appbundle --release
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/bundle/release/*.aab
      - build/app/outputs/flutter-apk/*.apk
