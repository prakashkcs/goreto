# Codemagic CI for Goreto.
#
# The iOS workflow exists because iOS cannot be built from the Windows machine
# this project is developed on. It produces a signed .ipa and, on the release
# workflow, uploads it to TestFlight.
#
# Before the first iOS run, set these up in the Codemagic UI — they are not in
# this file on purpose, because they are credentials:
#
#   1. Teams → Integrations → Developer Portal: connect the App Store Connect
#      API key (Apple Developer → Users and Access → Integrations → App Store
#      Connect API → generate a key, upload the .p8 with its Key ID and
#      Issuer ID). Code signing below fetches the profile through this.
#      Name it exactly `goreto_app_store_connect` — the ios-release workflow
#      refers to it by that name, and a mismatch fails validation rather than
#      falling back to anything.
#
#   2. Environment variables group `goreto_ios`:
#        APP_STORE_APPLE_ID   6835568733 — the numeric id of "Goreto Nepali
#                             Dating App" in App Store Connect. Not a secret;
#                             it is the number in the console URL
#                             appstoreconnect.apple.com/apps/<id>/
#        GOOGLE_SERVICES_IOS  base64 of ios/Runner/GoogleService-Info.plist,
#                             marked Secure. Firebase will not initialise on
#                             iOS without this file, so push and Google
#                             Sign-In stay dead until it is set. Produce it
#                             with:  base64 -i GoogleService-Info.plist
#
#   3. Environment variables group `goreto_android` (only for the android
#      workflow): CM_KEYSTORE, CM_KEYSTORE_PASSWORD, CM_KEY_ALIAS,
#      CM_KEY_PASSWORD — the same upload-keystore.jks already used locally.

definitions:
  flutter_version: &flutter_version 3.41.6

  base_cache: &base_cache
    cache_paths:
      - $HOME/.pub-cache
      - $FLUTTER_ROOT/.pub-cache

workflows:
  # ---------------------------------------------------------------------
  # ios-release is parked until the App Store Connect API key exists in
  # Codemagic under Teams -> Integrations -> Developer Portal, named
  # exactly `goreto_app_store_connect`. Codemagic validates that the named
  # integration resolves, and one unresolvable workflow invalidates the
  # whole file — which was also blocking ios-check from running at all.
  #
  # To restore: create that integration, then uncomment everything down to
  # the ios-check workflow below.
  # ---------------------------------------------------------------------
  # ios-release:
  #   name: iOS — build and ship to TestFlight
  #   instance_type: mac_mini_m2
  #   max_build_duration: 90
  #   environment:
  #     flutter: *flutter_version
  #     xcode: latest
  #     cocoapods: default
  #     groups:
  #       - goreto_ios
  #     vars:
  #       BUNDLE_ID: "com.nex.ekloapp"
  #     # Name of the App Store Connect API key as it is saved under
  #     # Teams -> Integrations -> Developer Portal. It must match exactly, and
  #     # it is what both ios_signing and the TestFlight upload authenticate
  #     # with — "auth: integration" below refers back to this.
  #     integrations:
  #       app_store_connect: goreto_app_store_connect
  #     ios_signing:
  #       distribution_type: app_store
  #       bundle_identifier: com.nex.ekloapp
  #   cache:
  #     <<: *base_cache
  #     cache_paths:
  #       - $HOME/.pub-cache
  #       - $HOME/Library/Caches/CocoaPods
  #   triggering:
  #     events:
  #       - tag
  #     tag_patterns:
  #       - pattern: "v*"
  #         include: true
  #   scripts:
  #     - name: Restore GoogleService-Info.plist
  #       script: |
  #         # Firebase config is not committed; it arrives as a secure variable.
  #         if [ -z "$GOOGLE_SERVICES_IOS" ]; then
  #           echo "GOOGLE_SERVICES_IOS is not set — Firebase would fail to"
  #           echo "initialise at launch, so refusing to build a broken IPA."
  #           exit 1
  #         fi
  #         echo "$GOOGLE_SERVICES_IOS" | base64 --decode > ios/Runner/GoogleService-Info.plist
  #         plutil -lint ios/Runner/GoogleService-Info.plist
  #
  #     - name: Flutter dependencies
  #       script: flutter pub get
  #
  #     - name: Install pods
  #       script: |
  #         find . -name "Podfile" -execdir pod install \;
  #
  #     - name: Set build number from Codemagic
  #       script: |
  #         # Keep CFBundleVersion monotonic without editing pubspec each time.
  #         BUILD_NUMBER=$(($(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0) + 1))
  #         echo "Using build number $BUILD_NUMBER"
  #         echo "BUILD_NUMBER=$BUILD_NUMBER" >> $CM_ENV
  #
  #     - name: Set up signing
  #       script: xcode-project use-profiles
  #
  #     - name: Build IPA
  #       script: |
  #         flutter build ipa --release \
  #           --build-number="$BUILD_NUMBER" \
  #           --export-options-plist=/Users/builder/export_options.plist
  #   artifacts:
  #     - build/ios/ipa/*.ipa
  #     - /tmp/xcodebuild_logs/*.log
  #     - flutter_drive.log
  #   publishing:
  #     app_store_connect:
  #       auth: integration
  #       submit_to_testflight: true
  #       # Left off deliberately: review submission should be a human decision.
  #       submit_to_app_store: false
  #
  # Note: this builds for a real device (-sdk iphoneos), not a simulator.
  # google_mlkit_face_detection pulls in MLKit pods that ship no arm64
  # simulator slice, so a simulator build fails on Apple Silicon runners.
  # Device builds are unaffected, and that is what ships.
  ios-check:
    name: iOS — analyse and build unsigned (every push)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: *flutter_version
      xcode: latest
      cocoapods: default
      groups:
        - goreto_ios
    cache: *base_cache
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: "*"
          include: true
    scripts:
      - name: Restore GoogleService-Info.plist
        script: |
          if [ -n "$GOOGLE_SERVICES_IOS" ]; then
            echo "$GOOGLE_SERVICES_IOS" | base64 --decode > ios/Runner/GoogleService-Info.plist
          else
            echo "No GOOGLE_SERVICES_IOS set — compiling without Firebase config."
          fi
      - name: Flutter dependencies
        script: flutter pub get
      - name: Analyse
        script: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Install pods
        script: |
          # Only this app's Podfile. A bare `find .` also walks
          # temp_flutter_project/, a scratch project committed years ago that
          # has nothing to do with the build.
          cd ios

          # No --repo-update: it makes CocoaPods re-read every version of every
          # podspec from the CDN, and with no Podfile.lock to narrow things down
          # that meant ~69 Firebase podspec fetches, all of which timed out.
          # The build image already ships a current spec repo.
          #
          # CDN timeouts are transient, so retry rather than failing the build
          # on one bad minute.
          for attempt in 1 2 3; do
            if pod install; then
              echo "pod install succeeded on attempt $attempt"
              exit 0
            fi
            echo "pod install failed (attempt $attempt of 3); waiting before retry"
            sleep $((attempt * 20))
          done

          echo "pod install still failing after 3 attempts."
          echo "If the errors are CDN timeouts the CocoaPods CDN is degraded;"
          echo "re-running the build later usually clears it."
          exit 1
      - name: Build unsigned
        script: |
          # `flutter build ios --no-codesign` compiles fine — the Xcode build
          # completes — but Flutter's wrapper then still demands a Development
          # Team and fails, which tells us nothing about whether the code is
          # sound. This workflow only needs to answer "does it compile", so
          # drive xcodebuild directly with signing switched off.
          set -euo pipefail
          flutter build ios --release --no-codesign --config-only
          cd ios
          xcodebuild \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build
    artifacts:
      - /tmp/xcodebuild_logs/*.log
      # Once a run resolves pods successfully, download this and commit it.
      # With a Podfile.lock in the repo CocoaPods stops exploring every
      # version of every pod, which is what made the CDN time out.
      - ios/Podfile.lock

  android-release:
    name: Android — signed release APK and AAB
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      flutter: *flutter_version
      java: 17
      groups:
        - goreto_android
    cache: *base_cache
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "v*"
          include: true
    scripts:
      - name: Restore the upload keystore
        script: |
          if [ -z "$CM_KEYSTORE" ]; then
            echo "CM_KEYSTORE is not set — an unsigned build cannot be shipped."
            exit 1
          fi
          echo "$CM_KEYSTORE" | base64 --decode > "$CM_BUILD_DIR/android/upload-keystore.jks"
          cat > "$CM_BUILD_DIR/android/key.properties" <<EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=../upload-keystore.jks
          EOF
      - name: Flutter dependencies
        script: flutter pub get
      - name: Build AAB
        script: flutter build appbundle --release
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/bundle/release/*.aab
      - build/app/outputs/flutter-apk/*.apk
